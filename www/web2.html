<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta name="theme-color" content="#064a34">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="ayat-shell.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Ayat - الآيات </title>

    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style2.css" />
    <link rel="icon" href="logo.png">
</head>
<body>

<div class="bg-orbs"></div>

<header class="topbar">
    <div class="brand">
        <div class="logo-wrap">
            <img class="logo" src="logo.png" alt="AyatHub" />
        </div>

        <div class="brand-text">
            <div class="title">Ayat - الآيات</div>
            <div class="subtitle">الأربعين النووية</div>
        </div>
    </div>

    <div class="pill">📜 الأحاديث النبوية</div>
</header>

<main class="page">

    <section class="panel">
        <div class="controls">

            <div class="control search">
                <label class="label">بحث في الأحاديث</label>
                <input id="searchInput" type="text"
                       placeholder="اكتب اسم الحديث أو كلمة منه..."
                       oninput="searchHadith()" />
            </div>

        </div>
    </section>

    <section id="hadithContainer"></section>

    <footer class="footer">
        Ayat - الآيات
    </footer>

</main>

<script src="app2.js"></script>
  <script src="ayat-shell.js"></script>
</body>
</html>
